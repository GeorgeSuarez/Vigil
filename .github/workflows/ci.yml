name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # Read-only token: this workflow never needs to push or comment.
    permissions:
      contents: read
    steps:
      # actions/checkout@v4.4.0 — persist-credentials: false keeps the GitHub
      # token out of the git config in the workspace (nothing here pushes).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # pnpm/action-setup@v4.4.0 — version comes from packageManager
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a

      # actions/setup-node@v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      # Browser audit: the map's own DOM, Calcite shadow roots and real computed
      # contrast, none of which jsdom can see. Builds and previews the app the
      # same way the deploy does, so the audited bundle is the shipped one.
      - name: Install the audit browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Accessibility audit (Chromium)
        run: pnpm run test:a11y

      - name: Build
        run: pnpm run build
